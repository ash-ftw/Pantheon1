[project]
name = "pantheon-backend"
version = "0.1.0"
description = "Pantheon — B2B Security Testing Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
    "structlog>=24.0,<25.0",
    "redis>=5.0,<6.0",
    "celery[redis]>=5.4,<6.0",
    "httpx>=0.27,<1.0",
    "PyJWT>=2.9,<3.0",
    "cryptography>=43.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "email-validator>=2.0.0",
    "kubernetes>=31.0,<32.0",
    "slowapi>=0.1.9,<1.0",
    "pyyaml>=6.0,<7.0",
    "GitPython>=3.1.40",
    "docker>=7.0.0",
    "prometheus-client>=0.20.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7",
    "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "RUF",    # Ruff-specific rules
]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ANN204",  # Missing return type annotation for special method
    "ANN001",  # Missing type annotation for function argument
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN201",  # Missing return type annotation
    "ANN202",  # Missing return type annotation for private function
    "S105",    # Possible hardcoded password (dev default credentials)
    "B008",    # Depends() in function signatures
    "E501",    # Line too long (handled by ruff format)
    "S110",    # try-except-pass
    "S607",    # Starting process with partial path
    "B904",    # raise ... from
    "RUF006",  # Store reference to return value of loop.create_task
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Standard pytest assertions

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "off"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
