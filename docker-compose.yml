# Pantheon — Local Development Services
# PostgreSQL 16, Redis 7, MinIO (S3-compatible), Docker Registry (MinIO-backed)
#
# Usage: docker compose up -d
# Backend and frontend run natively (not in containers).

services:
  postgres:
    image: postgres:16-alpine
    container_name: pantheon-postgres
    environment:
      POSTGRES_USER: pantheon
      POSTGRES_PASSWORD: pantheon_dev
      POSTGRES_DB: pantheon
    ports:
      - "5432:5432"
    volumes:
      - pantheon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantheon"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pantheon-redis
    ports:
      - "6379:6379"
    volumes:
      - pantheon_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pantheon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - pantheon_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Auto-create the registry bucket in MinIO on first startup
  minio-init:
    image: minio/mc:latest
    container_name: pantheon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set pantheon http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing pantheon/pantheon-registry;
        mc mb --ignore-existing pantheon/pantheon-artifacts;
        echo 'Buckets ready';
      "
    restart: "no"

  # Docker Registry v2 — stores image blobs in MinIO (S3-compatible)
  registry:
    image: registry:2
    container_name: pantheon-registry
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # S3 storage driver → MinIO
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_ACCESSKEY: minioadmin
      REGISTRY_STORAGE_S3_SECRETKEY: minioadmin
      REGISTRY_STORAGE_S3_REGION: us-east-1
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://minio:9000
      REGISTRY_STORAGE_S3_BUCKET: pantheon-registry
      REGISTRY_STORAGE_S3_SECURE: "false"
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      # Allow HTTP (no TLS for local dev)
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"   # Registry API
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Observability Stack: Prometheus (9090), Loki (3100), Grafana (3001)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pantheon-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pantheon_promdata:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.0.0
    container_name: pantheon-loki
    user: "0:0"
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - pantheon_lokidata:/tmp/loki

  grafana:
    image: grafana/grafana:10.4.1
    container_name: pantheon-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - pantheon_grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  pantheon_pgdata:
  pantheon_redisdata:
  pantheon_miniodata:
  pantheon_promdata:
  pantheon_lokidata:
  pantheon_grafanadata:
