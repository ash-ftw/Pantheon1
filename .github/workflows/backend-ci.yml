name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pantheon
          POSTGRES_PASSWORD: pantheon_dev
          POSTGRES_DB: pantheon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint & Format (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (Pyright)
        run: pyright

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://pantheon:pantheon_dev@localhost:5432/pantheon
        run: alembic upgrade head

      - name: Test (Pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://pantheon:pantheon_dev@localhost:5432/pantheon
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v
